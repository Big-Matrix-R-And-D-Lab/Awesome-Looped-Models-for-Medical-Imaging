name: README

on:
  pull_request:
    paths: ["data/**", "scripts/**", "config/**", "tests/**", "README.md"]
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "config/**", "README.md"]

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check taxonomy-derived files are up to date
        run: python scripts/taxonomy.py --check
      - name: Run the taxonomy and import tests
        run: python -m unittest discover -s tests -v
      - name: Validate CSV and check README is up to date
        run: python scripts/build_readme.py --check
      - name: Check the Pages site builds
        run: python scripts/build_site.py

  rebuild:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild README
        run: python scripts/build_readme.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: rebuild README from data/papers.csv"
            git push
          fi
