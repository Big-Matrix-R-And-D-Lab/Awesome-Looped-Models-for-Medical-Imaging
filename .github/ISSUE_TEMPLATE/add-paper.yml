# GENERATED by scripts/taxonomy.py from config/taxonomy.json. Do not edit by hand:
# run `python scripts/taxonomy.py --write` after an approved taxonomy change.
name: Add a paper
description: Suggest a looped / iterative model for medical imaging for the list
title: "[Paper] "
labels: ["new paper"]
body:
  - type: markdown
    attributes:
      value: |
        Papers are grouped by the closed taxonomy of the survey *Looped Models for Medical Imaging*
        (its Figure 3: five loop families plus a survey class). Pick the one classification that fits
        the paper's central loop, or choose **Not sure** and a maintainer will classify it.
        New sections cannot be created from an issue. See the
        [classification guide](../blob/main/docs/classification-guide.md).
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: paper_link
    attributes:
      label: Paper link
      description: Publisher page, DOI or arXiv URL
    validations:
      required: true
  - type: input
    id: code_link
    attributes:
      label: Code link (if any)
      description: The repository released by the paper's authors (say in the notes if it is not linked from the paper)
  - type: input
    id: venue
    attributes:
      label: Venue and year
      placeholder: e.g. MICCAI 2026, or arXiv preprint 2026
  - type: input
    id: modality
    attributes:
      label: Imaging modality
      description: Descriptive only. List every modality the paper uses; this never creates a section.
      placeholder: e.g. MRI, CT, histopathology, fundus
  - type: input
    id: loop
    attributes:
      label: What is iterated?
      description: The loop in one line, stating the iterated state, the feedback and the stopping rule.
      placeholder: e.g. a shared CNN prior alternates with a conjugate-gradient data-consistency step for K = 10 stages
  - type: dropdown
    id: classification
    attributes:
      label: Survey classification
      description: Loop family and branch from the survey's Figure 3 (1 Recurrent/equil., 2 Unrolled/DC, 3 Test-time, 4 Data-feedback, 5 Deployment/human, S Surveys).
      options:
        - "Not sure: let a maintainer classify it"
        - "Recurrent, recursive & equilibrium > Recurrent conv. segmentation"
        - "Recurrent, recursive & equilibrium > Recursive transformer U-Net"
        - "Recurrent, recursive & equilibrium > Recurrent dynamic MRI recon."
        - "Recurrent, recursive & equilibrium > Recurrent mask refinement"
        - "Recurrent, recursive & equilibrium > Deep equilibrium models"
        - "Unrolled & data-consistency reconstruction > Weight-shared unrolling"
        - "Unrolled & data-consistency reconstruction > Recurrent inference machines"
        - "Unrolled & data-consistency reconstruction > Recurrent variational network"
        - "Unrolled & data-consistency reconstruction > Multi-prior, edge, alignment DUNs"
        - "Unrolled & data-consistency reconstruction > Multi-contrast SR unfolding"
        - "Unrolled & data-consistency reconstruction > Motion search with data consistency"
        - "Test-time loops > Per-image weight / norm. adaptation"
        - "Test-time loops > Input, prompt, embedding TTA"
        - "Test-time loops > Test-time training"
        - "Test-time loops > Concept-level correction"
        - "Test-time loops > VLM reasoning, test-time scaling"
        - "Data-feedback training loops > Co-training, mutual learning"
        - "Data-feedback training loops > Self-training, distillation"
        - "Data-feedback training loops > Pseudo-label-guided synthesis"
        - "Data-feedback training loops > Training-data refinement"
        - "Data-feedback training loops > Active learning"
        - "Human, deployment & lifelong loops > Interactive / clinician correction"
        - "Human, deployment & lifelong loops > HITL annotation engines"
        - "Human, deployment & lifelong loops > Post-deployment drift correction"
        - "Human, deployment & lifelong loops > Continual memory replay"
        - "Human, deployment & lifelong loops > Self-improving agents, roadmap"
        - "Surveys > Background only"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Task, datasets, or the evidence for the classification
