<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Awesome Looped Models for Medical Imaging</title>
  <desc id="d">A curated list of iterative architectures, test-time adaptation and feedback loops in medical imaging, organised into five loop families.</desc>
