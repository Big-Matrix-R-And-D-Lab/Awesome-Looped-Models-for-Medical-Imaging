    <text x="76" y="276" fill="#ffffff" font-size="74" font-weight="700" letter-spacing="-1.5">for Medical Imaging</text>
    <text x="80" y="330" fill="#cbd5e1" font-size="24">Iterative architectures, test-time adaptation and feedback</text>
    <circle cx="92" cy="392" r="12" fill="#7c7cf0"/><text x="92" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1220">1</text><text x="116" y="398" font-size="20" fill="#e2e8f0">Recurrent / equilibrium</text>
    <circle cx="92" cy="432" r="12" fill="#2bb8c4"/><text x="92" y="437" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1220">2</text><text x="116" y="438" font-size="20" fill="#e2e8f0">Unrolled / data consistency</text>
    <circle cx="92" cy="472" r="12" fill="#f2a03a"/><text x="92" y="477" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1220">3</text><text x="116" y="478" font-size="20" fill="#e2e8f0">Test-time</text>
    <circle cx="92" cy="512" r="12" fill="#e2589c"/><text x="92" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1220">4</text><text x="116" y="518" font-size="20" fill="#e2e8f0">Data-feedback</text>
    <circle cx="92" cy="552" r="12" fill="#4cc584"/><text x="92" y="557" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1220">5</text><text x="116" y="558" font-size="20" fill="#e2e8f0">Human, deployment &amp; lifelong</text>
